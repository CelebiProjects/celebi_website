<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode | default .Site.Language.Lang }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <a class="skip-link" href="#main">{{ T "skip_to_content" }}</a>
  {{- partial "header.html" . -}}
  <main id="main">
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
  <script src="{{ "js/main.js" | relURL }}" defer></script>
</body>
</html>
